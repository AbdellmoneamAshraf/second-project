<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stress Free Operations</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
  <link rel="stylesheet" href="main.css" />
</head>

<body class="bg-slate-200 text-slate-800 antialiased">
  <header class="mx-auto max-w-6xl px-4 pt-6 sm:px-6 lg:px-8">
    <nav class="flex flex-wrap items-center gap-2 text-sm text-slate-600">
      <a href="#" class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-slate-700 shadow-sm ring-1 ring-slate-200">
        <i class="fa-solid fa-house-chimney text-xs"></i>
      </a>
      <span class="text-slate-400">/</span>
      <a href="#" class="hover:text-slate-900">Home</a>
      <span class="text-slate-400">/</span>
      <a href="#" class="hover:text-slate-900">Grocery</a>
      <span class="text-slate-400">/</span>
      <span class="font-medium text-slate-900">Product Details</span>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-10 pt-4 sm:px-6 lg:px-8">
    <section class="overflow-hidden rounded-[28px] bg-white shadow-[0_12px_40px_rgba(15,23,42,0.08)] ring-1 ring-slate-200">
      <div class="grid gap-6 p-4 sm:p-6 lg:grid-cols-[120px_minmax(0,1.1fr)_minmax(0,1.3fr)] lg:p-8">
        <div class="order-2 flex gap-3 overflow-x-auto pb-1 lg:order-1 lg:flex-col lg:overflow-visible">
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover ring-2 ring-slate-200 transition hover:scale-[1.02]" src="./imgs/OIP (1).webp" alt="thumbnail 1" />
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover transition hover:scale-[1.02]" src="./imgs/OIP (2).webp" alt="thumbnail 2" />
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover transition hover:scale-[1.02]" src="./imgs/OIP (3).webp" alt="thumbnail 3" />
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover transition hover:scale-[1.02]" src="./imgs/fresh-strawberry-798.jpg" alt="thumbnail 4" />
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover transition hover:scale-[1.02]" src="./imgs/OIP (4).webp" alt="thumbnail 5" />
          <img class="h-20 w-20 shrink-0 rounded-xl border border-slate-200 bg-slate-50 object-cover transition hover:scale-[1.02]" src="./imgs/product-2.webp" alt="thumbnail 6" />
        </div>

        <div class="order-1 lg:order-2">
          <div class="flex h-full items-center justify-center rounded-[24px] bg-slate-50 p-4 sm:p-6">
            <img class="w-full max-w-[480px] rounded-[20px] object-cover shadow-sm" src="./imgs/thumb-lg-1.webp" alt="Main product image" />
          </div>
        </div>

        <div class="order-3 space-y-5 lg:space-y-6">
          <div class="inline-flex items-center rounded-md bg-red-500 px-3 py-2 text-[11px] font-bold tracking-[0.2em] text-white shadow-sm">
            SALES
          </div>

          <h1 class="text-2xl font-semibold leading-snug text-slate-800 sm:text-3xl">
            Crisp Red Apples - Sweet, Juicy & Fresh ...
          </h1>

          <div class="flex flex-wrap items-center gap-2 text-sm text-slate-600">
            <div class="flex items-center gap-1 text-yellow-400">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-regular fa-star text-slate-300"></i>
            </div>
            <span class="text-slate-500">(11.78k reviews)</span>
          </div>

          <div class="flex flex-wrap items-center gap-3 text-lg font-bold text-slate-900">
            <span class="text-3xl">$62.97</span>
            <span class="text-base text-slate-400 line-through">$62.97</span>
            <span class="rounded-md bg-yellow-400 px-2 py-1 text-sm font-semibold text-slate-900">15% OFF</span>
          </div>

          <div class="h-px w-full bg-slate-200"></div>

          <div class="flex items-center gap-3 text-base text-slate-700">
            <span class="font-semibold">Color:</span>
            <span class="font-medium">Green</span>
          </div>

          <div class="flex flex-wrap gap-3">
            <button class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-emerald-700 bg-emerald-50 text-emerald-700 transition hover:scale-105">
              <i class="fa-regular fa-image"></i>
            </button>
            <button class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-blue-500 bg-blue-50 text-blue-500 transition hover:scale-105">
              <i class="fa-regular fa-image"></i>
            </button>
            <button class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-yellow-400 bg-yellow-50 text-yellow-500 transition hover:scale-105">
              <i class="fa-regular fa-image"></i>
            </button>
            <button class="flex h-12 w-12 items-center justify-center rounded-full border-2 border-rose-400 bg-rose-50 text-rose-500 transition hover:scale-105">
              <i class="fa-regular fa-image"></i>
            </button>
          </div>

          <div class="space-y-3">
            <p class="text-base font-semibold text-slate-800">Pack Size: 250 ML</p>
            <div class="flex flex-wrap gap-2">
              <button class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">60 ML</button>
              <button class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">120 ML</button>
              <button class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">220 ML</button>
              <button class="rounded-xl border border-slate-300 bg-slate-100 px-3 py-2 text-sm font-medium text-slate-800 shadow-sm">250 ML</button>
              <button class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">300 ML</button>
              <button class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50">500 ML</button>
            </div>
          </div>

          <div class="space-y-3">
            <p class="text-base font-semibold text-slate-800">Quantity</p>
            <div class="flex flex-wrap items-center gap-3">
              <div class="flex items-center gap-4 rounded-xl border border-slate-300 bg-white px-4 py-2 text-lg font-bold text-slate-700 shadow-sm">
                <button class="text-slate-400">-</button>
                <span>1</span>
                <button class="text-slate-500">+</button>
              </div>

              <button class="rounded-xl bg-yellow-400 px-6 py-3 text-sm font-semibold text-slate-900 shadow-[0_8px_24px_rgba(250,204,21,0.5)] transition hover:-translate-y-0.5 hover:bg-yellow-300">
                Buy Now
              </button>

              <button class="rounded-xl bg-teal-400 px-6 py-3 text-sm font-semibold text-white shadow-[0_8px_24px_rgba(45,212,191,0.4)] transition hover:-translate-y-0.5 hover:bg-teal-300">
                Add to cart
              </button>
            </div>
          </div>

          <div class="flex flex-wrap items-center gap-3 pt-2 text-sm text-blue-600">
            <a href="#" class="flex items-center gap-2 font-medium hover:text-blue-700">Share <i class="fa-regular fa-share-from-square"></i></a>
            <span class="text-slate-300">|</span>
            <a href="#" class="flex items-center gap-2 font-medium hover:text-blue-700">Compare <i class="fa-solid fa-code-compare"></i></a>
          </div>

          <div class="space-y-3 text-sm text-slate-700 sm:text-base">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-semibold text-slate-900">Free Shipping</span>
              <span class="text-slate-500">: Estimated Delivery Time 5-7 Days</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-semibold text-slate-900">SKU</span>
              <span class="text-slate-500">: 456</span>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-semibold text-slate-900">Categories</span>
              <span class="text-slate-500">: Clothing, Laptop</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="jmd.js"></script>
</body>

</html
